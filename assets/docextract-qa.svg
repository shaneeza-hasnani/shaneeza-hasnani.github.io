<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="title desc">
  <title id="title">DocExtract QA evaluation pipeline</title>
  <desc id="desc">An invoice moves through an API into JSON validation and an accuracy report.</desc>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c8bea8" opacity=".55"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="7" dy="8" stdDeviation="0" flood-color="#4a365d" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="680" height="400" fill="#f4efdf"/>
  <rect width="680" height="400" fill="url(#dots)"/>

  <text x="42" y="48" fill="#7253b7" font-family="monospace" font-size="14" font-weight="700" letter-spacing="2">DOCUMENT EXTRACTION / QA</text>

  <g filter="url(#shadow)">
    <g transform="rotate(-2 145 206)">
      <rect x="46" y="82" width="198" height="248" fill="#fffaf0" stroke="#211e2b" stroke-width="3"/>
      <rect x="66" y="105" width="65" height="24" fill="#efd05b"/>
      <text x="76" y="122" fill="#211e2b" font-family="monospace" font-size="12" font-weight="700">INVOICE</text>
      <path d="M66 154h150M66 175h94M66 211h150M66 234h150M66 257h105" stroke="#6d6667" stroke-width="5" opacity=".45"/>
      <path d="M66 288h85" stroke="#7253b7" stroke-width="7"/>
      <text x="66" y="313" fill="#7253b7" font-family="monospace" font-size="13" font-weight="700">TOTAL $1,272</text>
    </g>

    <g>
      <rect x="285" y="104" width="128" height="74" rx="5" fill="#7253b7" stroke="#211e2b" stroke-width="3"/>
      <text x="349" y="135" text-anchor="middle" fill="#fffaf0" font-family="monospace" font-size="13" font-weight="700">POST /DOCS</text>
      <text x="349" y="157" text-anchor="middle" fill="#e7daf7" font-family="monospace" font-size="11">JOB ID → POLL</text>
      <path d="M245 140h30" stroke="#211e2b" stroke-width="3"/>
      <path d="m269 132 9 8-9 8" fill="none" stroke="#211e2b" stroke-width="3"/>
    </g>

    <g>
      <rect x="452" y="82" width="180" height="128" rx="5" fill="#292331" stroke="#211e2b" stroke-width="3"/>
      <text x="472" y="111" fill="#efd05b" font-family="monospace" font-size="12">{</text>
      <text x="487" y="135" fill="#fffaf0" font-family="monospace" font-size="11">"total": 1272,</text>
      <text x="487" y="158" fill="#fffaf0" font-family="monospace" font-size="11">"tax": 72,</text>
      <text x="487" y="181" fill="#496f5a" font-family="monospace" font-size="11">"valid": true</text>
      <text x="472" y="199" fill="#efd05b" font-family="monospace" font-size="12">}</text>
      <path d="M414 140h28" stroke="#211e2b" stroke-width="3"/>
      <path d="m436 132 9 8-9 8" fill="none" stroke="#211e2b" stroke-width="3"/>
    </g>

    <g>
      <rect x="293" y="235" width="330" height="108" fill="#fffaf0" stroke="#211e2b" stroke-width="3"/>
      <text x="315" y="265" fill="#211e2b" font-family="monospace" font-size="12" font-weight="700">FIELD ACCURACY</text>
      <text x="315" y="307" fill="#aa5260" font-family="monospace" font-size="24" font-weight="700">45.8%</text>
      <path d="M409 297h64" stroke="#211e2b" stroke-width="3"/>
      <path d="m466 289 10 8-10 8" fill="none" stroke="#211e2b" stroke-width="3"/>
      <text x="496" y="307" fill="#496f5a" font-family="monospace" font-size="24" font-weight="700">100%</text>
      <text x="315" y="329" fill="#6d6667" font-family="monospace" font-size="9">3 SYNTHETIC LAYOUTS · 21 TESTS</text>
    </g>
  </g>
</svg>
